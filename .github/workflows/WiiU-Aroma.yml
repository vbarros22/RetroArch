# Wii U (Aroma) package. One job per core builds its <name>_libretro_wiiu.a
# (a core that fails to build is left out, the rest still ship); the
# package job then links one .rpx per core, builds the launcher (.wuhb)
# and zips it all in the SD card layout. Runs on pushes to aroma-atual
# and by hand (Actions -> "Wii U (Aroma)" -> Run workflow). A tag named
# wiiu-aroma-* also publishes the .zip as a GitHub pre-release.
#
# To add a core: one line in the matrix below (repo, branch, folder with
# its makefile). Makefile.libretro is used when present, Makefile otherwise.
name: Wii U (Aroma)

on:
  push:
    branches: [aroma-atual]
    tags: ['wiiu-aroma-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: devkitpro/devkitppc:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tested on hardware
          - { name: fceumm,           repo: libretro/libretro-fceumm,            branch: master,     dir: . }
          - { name: snes9x,           repo: libretro/snes9x,                     branch: master,     dir: libretro }
          - { name: pcsx_rearmed,     repo: vbarros22/pcsx_rearmed,              branch: wiiu-aroma, dir: . }
          # New in 0.2 (need testing on hardware)
          - { name: genesis_plus_gx,  repo: libretro/Genesis-Plus-GX,            branch: master,     dir: . }
          - { name: picodrive,        repo: libretro/picodrive,                  branch: master,     dir: . }
          # mGBA pinned to the last libretro commit with Makefile.libretro (3/8/2026);
          # later ones build with CMake only
          - { name: mgba,             repo: libretro/mgba,                       branch: master,     dir: ., ref: 517e518c48e351def04042dc159064dd098830a9 }
          - { name: vba_next,         repo: libretro/vba-next,                   branch: master,     dir: . }
          - { name: gambatte,         repo: libretro/gambatte-libretro,          branch: master,     dir: . }
          - { name: gearboy,          repo: libretro/Gearboy,                    branch: master,     dir: platforms/libretro, args: 'CC=powerpc-eabi-gcc CXX=powerpc-eabi-g++ AR=powerpc-eabi-ar' }
          - { name: nestopia,         repo: libretro/nestopia,                   branch: master,     dir: libretro }
          # RetroArch is built without threads on the Wii U, so no frontend rthreads
          - { name: snes9x2010,       repo: libretro/snes9x2010,                 branch: master,     dir: ., args: 'HAVE_THREADS=0 THREADS_FROM_FRONTEND=0' }
          - { name: mednafen_pce_fast, repo: libretro/beetle-pce-fast-libretro,  branch: master,     dir: . }
          - { name: mednafen_vb,      repo: libretro/beetle-vb-libretro,         branch: master,     dir: . }
          - { name: mednafen_ngp,     repo: libretro/beetle-ngp-libretro,        branch: master,     dir: . }
          - { name: mednafen_wswan,   repo: libretro/beetle-wswan-libretro,      branch: master,     dir: . }
          - { name: stella2014,       repo: libretro/stella2014-libretro,        branch: master,     dir: . }
          - { name: handy,            repo: libretro/libretro-handy,             branch: master,     dir: . }
          # FBNeo pinned to the libretro build of 17/11/2026, before "BurnArtwork": the artwork code
          # pulls in plutosvg, which needs sys/mman.h (absent on the Wii U)
          # FBNeo: the full core (35 MB code + 89 MB data) is too big for the Wii U
          # loader and hangs before main, so ship upstream's driver subsets instead.
          # A subset regenerates driverlist.h (REGEN_HEADERS=1: perl + host gcc).
          # Pinned to the libretro build of 17/11/2026, before "BurnArtwork" (its
          # plutosvg dependency needs sys/mman.h, absent on the Wii U).
          - { name: fbneo_neogeo,     repo: libretro/FBNeo,                      branch: master,     dir: src/burner/libretro, ref: e0ecdb11af563f31e698e590d69a85f087f528b3, args: 'SUBSET=neogeo REGEN_HEADERS=1' }
          - { name: fbneo_cps12,      repo: libretro/FBNeo,                      branch: master,     dir: src/burner/libretro, ref: e0ecdb11af563f31e698e590d69a85f087f528b3, args: 'SUBSET=cps12 REGEN_HEADERS=1' }
          - { name: fbalpha2012,      repo: libretro/fbalpha2012,                branch: master,     dir: svn-current/trunk }
          - { name: mame2003_plus,    repo: libretro/mame2003-plus-libretro,     branch: master,     dir: . }
          - { name: prboom,           repo: libretro/libretro-prboom,            branch: master,     dir: . }
          - { name: nxengine,         repo: libretro/nxengine-libretro,          branch: master,     dir: . }
          # 3DO (Opera) left out: it builds and links (core-patches/opera.patch), but
          # its big-endian path is incomplete and every game, BIOS included, stays black
          # - { name: opera,            repo: libretro/opera-libretro,             branch: master,     dir: . }
          # Batch from the cores Ploggy's build ships (need testing on hardware)
          - { name: gpsp,                repo: libretro/gpsp,                           branch: master,     dir: . }
          - { name: gearsystem,          repo: drhelius/Gearsystem,                     branch: master,     dir: platforms/libretro, args: 'CC=powerpc-eabi-gcc CXX=powerpc-eabi-g++ AR=powerpc-eabi-ar' }
          - { name: gearcoleco,          repo: drhelius/Gearcoleco,                     branch: main,       dir: platforms/libretro, args: 'CC=powerpc-eabi-gcc CXX=powerpc-eabi-g++ AR=powerpc-eabi-ar' }
          - { name: quicknes,            repo: libretro/QuickNES_Core,                  branch: master,     dir: . }
          # snes9x2002: audio is wrong on big-endian; Snes9x 2005 Plus covers it
          # - { name: snes9x2002,          repo: libretro/snes9x2002,                     branch: master,     dir: . }
          # snes9x2005: audio is wrong on big-endian; Snes9x 2005 Plus covers it
          # - { name: snes9x2005,          repo: libretro/snes9x2005,                     branch: master,     dir: . }
          - { name: snes9x2005_plus,     repo: libretro/snes9x2005,                     branch: master,     dir: ., args: 'USE_BLARGG_APU=1' }
          # stella2023: its Makefile runs a configure step that fails for the Wii U
          # - { name: stella2023,          repo: libretro/stella2023,                     branch: master,     dir: . }
          - { name: prosystem,           repo: libretro/prosystem-libretro,             branch: master,     dir: . }
          - { name: a5200,               repo: libretro/a5200,                          branch: master,     dir: . }
          - { name: atari800,            repo: libretro/libretro-atari800,              branch: master,     dir: . }
          - { name: vecx,                repo: libretro/libretro-vecx,                  branch: master,     dir: . }
          - { name: o2em,                repo: libretro/libretro-o2em,                  branch: master,     dir: . }
          # freeintv: builds, but elf2rpl rejects its TLS relocations (types 70/72)
          # - { name: freeintv,            repo: libretro/FreeIntv,                       branch: master,     dir: . }
          - { name: pokemini,            repo: libretro/PokeMini,                       branch: master,     dir: . }
          # race: crashes in tlcs_step on launch (big-endian); Beetle NeoPop covers NGP
          # - { name: race,                repo: libretro/RACE,                           branch: master,     dir: . }
          # mednafen_pce: -U__UINT32_TYPE__ in its Wii U flags breaks GCC 16's libstdc++
          # - { name: mednafen_pce,        repo: libretro/beetle-pce-libretro,            branch: master,     dir: . }
          - { name: mednafen_supergrafx, repo: libretro/beetle-supergrafx-libretro,     branch: master,     dir: . }
          - { name: mednafen_lynx,       repo: libretro/beetle-lynx-libretro,           branch: master,     dir: . }
          # NeoCD pinned before the August 2026 rewrite, which broke text and
          # colours on big-endian (the fix layer packs pixel pairs little-endian)
          - { name: neocd,               repo: libretro/neocd_libretro,                 branch: master,     dir: ., ref: 9e9ad181bed60f84f9cff02c03617b41e8a31cfe }
          # geolith: needs zlib, absent from the devkitPPC image
          # - { name: geolith,             repo: libretro/geolith-libretro,               branch: master,     dir: libretro }
          - { name: mame2000,            repo: libretro/mame2000-libretro,              branch: master,     dir: . }
          - { name: mame2003_midway,     repo: libretro/mame2003_midway,                branch: master,     dir: . }
          - { name: genesis_plus_gx_wide, repo: libretro/Genesis-Plus-GX-Wide,           branch: main,       dir: . }
          - { name: fbalpha2012_cps1,    repo: libretro/fbalpha2012_cps1,               branch: master,     dir: . }
          - { name: fbalpha2012_cps2,    repo: libretro/fbalpha2012_cps2,               branch: master,     dir: . }
          - { name: fbalpha2012_neogeo,  repo: libretro/fbalpha2012_neogeo,             branch: master,     dir: . }
          - { name: bluemsx,          repo: libretro/blueMSX-libretro,           branch: master,     dir: . }
    steps:
    - name: Tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates
        case "${{ matrix.args }}" in *REGEN_HEADERS*) \
          apt-get install -y --no-install-recommends perl gcc g++ libc6-dev ;; esac
    - uses: actions/checkout@v4
      with:
        path: RetroArch
        sparse-checkout: pkg/wiiu/core-patches
    - name: Fetch ${{ matrix.name }}
      run: |
        URL="https://github.com/${{ matrix.repo }}.git"
        if [ -n "${{ matrix.ref }}" ]; then
          # pinned to a known-good commit
          git init -q src
          git -C src fetch -q --depth 1 "$URL" "${{ matrix.ref }}"
          git -C src checkout -q FETCH_HEAD
          git -C src submodule update -q --init --recursive --depth 1
        else
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            -b "${{ matrix.branch }}" "$URL" src
        fi
        git -C src log -1 --format="${{ matrix.name }} at %h (%cI) %s"
        # Wii U fixes not (yet) upstream: pkg/wiiu/core-patches/<name>.patch
        P="$GITHUB_WORKSPACE/RetroArch/pkg/wiiu/core-patches/${{ matrix.name }}.patch"
        if [ -f "$P" ]; then git -C src apply --verbose "$P"; fi
    - name: Build ${{ matrix.name }}
      run: |
        export PATH="$PATH:$DEVKITPRO/tools/bin:$DEVKITPPC/bin"
        cd "src/${{ matrix.dir }}"
        MF=Makefile
        for m in Makefile.libretro makefile.libretro; do [ -f $m ] && MF=$m && break; done
        make -f $MF platform=wiiu -j$(nproc) ${{ matrix.args }}
        mkdir -p "$GITHUB_WORKSPACE/out"
        A=$(find . -maxdepth 2 -name '*_libretro_wiiu.a' | head -1)
        test -n "$A" || { echo "no *_libretro_wiiu.a produced"; exit 1; }
        cp "$A" "$GITHUB_WORKSPACE/out/${{ matrix.name }}_libretro_wiiu.a"
    - uses: actions/upload-artifact@v4
      with:
        name: core-${{ matrix.name }}
        path: out/*.a
        retention-days: 7

  package:
    needs: core
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: devkitpro/devkitppc:latest
      options: --user root
    env:
      RDB_URL: https://raw.githubusercontent.com/libretro/libretro-database/master/rdb
    steps:
    - name: Tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git curl zip unzip ca-certificates python3

    - uses: actions/checkout@v4
      with:
        path: RetroArch

    - uses: actions/download-artifact@v4
      with:
        pattern: core-*
        merge-multiple: true
        path: RetroArch/dist-scripts

    - name: Core info and menu assets
      run: |
        ls -la RetroArch/dist-scripts/*.a
        git clone --depth 1 https://github.com/libretro/libretro-core-info.git
        curl -fL -o RetroArch/dist-scripts/assets.zip \
          https://buildbot.libretro.com/assets/frontend/assets.zip

    - name: Build RetroArch (Salamander, .wuhb, one .rpx per core)
      run: |
        export PATH="$PATH:$DEVKITPRO/tools/bin:$DEVKITPPC/bin"
        cd RetroArch/dist-scripts
        INFO_DIR=$GITHUB_WORKSPACE/libretro-core-info sh ./wiiu-cores.sh

    - name: SD card layout
      run: |
        SD=$GITHUB_WORKSPACE/sd
        mkdir -p "$SD/retroarch/database/rdb" "$SD/retroarch/cores/system"
        cp -r RetroArch/pkg/wiiu/wiiu RetroArch/pkg/wiiu/retroarch "$SD/"
        # The databases each shipped core's .info asks for
        python3 - "$SD/retroarch/cores/info" "$SD/retroarch/database/rdb" "$RDB_URL" <<'PY'
        import os, re, sys, urllib.parse, urllib.request
        info_dir, rdb_dir, base = sys.argv[1:4]
        names = set()
        for f in os.listdir(info_dir):
            for line in open(os.path.join(info_dir, f), encoding="utf-8", errors="ignore"):
                m = re.match(r'\s*database\s*=\s*"([^"]*)"', line)
                if m:
                    names.update(n.strip() for n in m.group(1).split("|") if n.strip())
        for n in sorted(names):
            url = base + "/" + urllib.parse.quote(n + ".rdb")
            try:
                urllib.request.urlretrieve(url, os.path.join(rdb_dir, n + ".rdb"))
                print("rdb:", n)
            except Exception as e:
                print("rdb missing:", n, e)
        PY
        # blueMSX needs its Machines/ and Databases/ folders in system/
        # (they ship in the core's own repo, under system/bluemsx/)
        git clone -q --depth 1 https://github.com/libretro/blueMSX-libretro.git bluemsx-src \
          && cp -r bluemsx-src/system/bluemsx/Databases bluemsx-src/system/bluemsx/Machines \
                   "$SD/retroarch/cores/system/" \
          || echo "WARNING: blueMSX system files not fetched"
        ls "$SD/retroarch/cores/system"
        cp RetroArch/pkg/wiiu/README.md "$SD/LEIA-ME-WiiU.md"
        cp RetroArch/pkg/wiiu/escutar-log.ps1 "$SD/"
        echo "Coloque aqui as BIOS (veja LEIA-ME-WiiU.md)" > "$SD/retroarch/cores/system/BIOS-AQUI.txt"
        ls "$SD/retroarch/cores"
        cd "$SD" && zip -r "$GITHUB_WORKSPACE/RetroArch-WiiU-Aroma.zip" .

    - uses: actions/upload-artifact@v4
      with:
        name: RetroArch-WiiU-Aroma
        path: |
          RetroArch-WiiU-Aroma.zip
          RetroArch/dist-scripts/elf/*.elf

    - name: Release (tags only)
      if: startsWith(github.ref, 'refs/tags/wiiu-aroma-')
      uses: softprops/action-gh-release@v2
      with:
        files: RetroArch-WiiU-Aroma.zip
        body_path: RetroArch/pkg/wiiu/RELEASE-NOTES.md
        name: RetroArch Wii U (Aroma) ${{ github.ref_name }}
        prerelease: true
