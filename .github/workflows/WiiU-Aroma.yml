# Wii U (Aroma) package: builds the launcher (.wuhb), one .rpx per core and
# a .zip laid out like the SD card. Runs on pushes to aroma-atual and by
# hand (Actions tab -> "Wii U (Aroma)" -> Run workflow). A tag named
# wiiu-aroma-* also publishes the .zip as a GitHub release.
name: Wii U (Aroma)

on:
  push:
    branches: [aroma-atual]
    tags: ['wiiu-aroma-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    env:
      PCSX_REPO: https://github.com/vbarros22/pcsx_rearmed.git
      PCSX_BRANCH: wiiu-aroma
      RDB_URL: https://raw.githubusercontent.com/libretro/libretro-database/master/rdb

    steps:
    - name: Tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git curl zip unzip ca-certificates

    - uses: actions/checkout@v4
      with:
        path: RetroArch

    - name: Fetch cores, core info and assets
      run: |
        git clone --depth 1 --recurse-submodules -b "$PCSX_BRANCH" "$PCSX_REPO" pcsx_rearmed
        git clone --depth 1 https://github.com/libretro/libretro-fceumm.git
        git clone --depth 1 https://github.com/libretro/snes9x.git
        git clone --depth 1 https://github.com/libretro/libretro-core-info.git
        curl -fL -o RetroArch/dist-scripts/assets.zip \
          https://buildbot.libretro.com/assets/frontend/assets.zip

    - name: Build cores
      run: |
        export PATH="$PATH:$DEVKITPRO/tools/bin:$DEVKITPPC/bin"
        J=$(nproc)
        DIST=$GITHUB_WORKSPACE/RetroArch/dist-scripts
        make -C libretro-fceumm -f Makefile.libretro platform=wiiu -j$J
        cp libretro-fceumm/fceumm_libretro_wiiu.a "$DIST/"
        make -C snes9x/libretro platform=wiiu -j$J
        cp snes9x/libretro/snes9x_libretro_wiiu.a "$DIST/"
        make -C pcsx_rearmed -f Makefile.libretro platform=wiiu -j$J
        cp pcsx_rearmed/pcsx_rearmed_libretro_wiiu.a "$DIST/"

    - name: Build RetroArch (Salamander, .wuhb, one .rpx per core)
      run: |
        export PATH="$PATH:$DEVKITPRO/tools/bin:$DEVKITPPC/bin"
        cd RetroArch/dist-scripts
        INFO_DIR=$GITHUB_WORKSPACE/libretro-core-info sh ./wiiu-cores.sh

    - name: SD card layout
      run: |
        SD=$GITHUB_WORKSPACE/sd
        mkdir -p "$SD/retroarch/database/rdb" "$SD/retroarch/cores/system"
        cp -r RetroArch/pkg/wiiu/wiiu RetroArch/pkg/wiiu/retroarch "$SD/"
        for db in "Nintendo - Nintendo Entertainment System" \
                  "Nintendo - Super Nintendo Entertainment System" \
                  "Sony - PlayStation"; do
          curl -fL -o "$SD/retroarch/database/rdb/$db.rdb" \
            "$RDB_URL/$(echo "$db" | sed 's/ /%20/g').rdb"
        done
        cp RetroArch/pkg/wiiu/README.md "$SD/LEIA-ME-WiiU.md"
        cp RetroArch/pkg/wiiu/escutar-log.ps1 "$SD/"
        echo "Coloque aqui as BIOS (veja LEIA-ME-WiiU.md)" > "$SD/retroarch/cores/system/BIOS-AQUI.txt"
        ls -R "$SD" | head -50
        cd "$SD" && zip -r "$GITHUB_WORKSPACE/RetroArch-WiiU-Aroma.zip" .

    - uses: actions/upload-artifact@v4
      with:
        name: RetroArch-WiiU-Aroma
        path: |
          RetroArch-WiiU-Aroma.zip
          RetroArch/dist-scripts/elf/*.elf

    - name: Release (tags only)
      if: startsWith(github.ref, 'refs/tags/wiiu-aroma-')
      uses: softprops/action-gh-release@v2
      with:
        files: RetroArch-WiiU-Aroma.zip
        prerelease: true
